name: Production certification gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip build twine pip-audit bandit
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m pip_audit . --progress-spinner off
      - run: bandit -q -r src/public_health_framework -ll
      - run: python -m build
      - run: twine check dist/*
