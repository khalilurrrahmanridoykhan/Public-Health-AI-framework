[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "public-health-framework"
version = "0.8.0a15"
description = "Build extensible public-health data systems, APIs, and dashboards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Khalilur Rahman Ridoy Khan"}]
keywords = ["public health", "health informatics", "surveillance", "data", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0,<3.0",
  "starlette>=0.40,<1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
phframe = "public_health_framework.cli:main"

[project.urls]
Homepage = "https://github.com/khalilurrrahmanridoykhan/Public-Health-AI-framework"
Documentation = "https://github.com/khalilurrrahmanridoykhan/Public-Health-AI-framework#readme"
Issues = "https://github.com/khalilurrrahmanridoykhan/Public-Health-AI-framework/issues"
Changelog = "https://github.com/khalilurrrahmanridoykhan/Public-Health-AI-framework/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"public_health_framework.ui" = ["*.css", "*.js", "*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
