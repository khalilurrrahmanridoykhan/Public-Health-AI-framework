services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      PHFRAME_DATABASE_URL: postgresql+psycopg://phframe:${POSTGRES_PASSWORD}@database/phframe
    depends_on:
      database: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["phframe", "worker", "--interval", "60"]
    env_file: .env
    environment:
      PHFRAME_DATABASE_URL: postgresql+psycopg://phframe:${POSTGRES_PASSWORD}@database/phframe
    depends_on:
      database: {condition: service_healthy}
    restart: unless-stopped
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phframe
      POSTGRES_USER: phframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["phframe-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U phframe"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
volumes:
  phframe-data:
